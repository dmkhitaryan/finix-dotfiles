# Window effect

blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

shadows=0
layer_shadows=0
shadow_only_floating=1
shadows_size=10
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadowscolor=0x282a36ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0


# Animation Configuration
# support type: zoom, slide
# tag_animation_direction: 1-horizontal, 0-vertical

animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8

animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0

animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1


# Scroller Layout Setting

scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0


# Master-Stack Layout Setting

new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=1


# Dwindle Layout Setting

dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0


# Overview Setting

hotarea_size=10
enable_hotarea=0
ov_tab_mode=1
#ov_no_resize=1
overviewgappi=5
overviewgappo=30


# Misc

no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
cursor_theme=catppuccin-frappe-lavender-cursors
drag_tile_to_tile=1
drag_tile_small=1


# Keyboard

repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us,ru
xkb_rules_options=grp:ctrl_space_toggle

# Trackpad
# need relogin to make it apply

disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1


# Mouse
# need relogin to make it apply

mouse_natural_scrolling=0


# Appearance

gappih=5
gappiv=5
gappoh=10
gappov=10

scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

borderpx=4

rootcolor=0x282a36ff
bordercolor=0x6d7290ff
dropcolor=0xbd93f980
splitcolor=0x8be9fdff
focuscolor=0xbd93f9ff
maximizescreencolor=0xff79c6ff
urgentcolor=0xff5555ff
scratchpadcolor=0x8be9fdff
globalcolor=0x5a00d9ff
overlaycolor=0xc60071ff


# Layout support:
# tile, scroller, grid, deck, monocle,
# center_tile, vertical_tile, vertical_scroller

tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile


# ============================================================
# Key Bindings
#
# SUPER = primary window-management modifier
# ALT   = compositor / Mango / secondary modifier
# ============================================================


# Reload Mango config

bind=ALT,r,reload_config


# Menu and terminal

bind=SUPER,space,spawn,fuzzel
bind=SUPER,Return,spawn,foot


# Control brightness
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-


# Media controls
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=CTRL,grave,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle

bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioNext,spawn,playerctl next


# Screenshotting
bind=SUPER,s,spawn,flameshot gui


# Exit / close

bind=ALT,q,quit
bind=SUPER,q,killclient,


# Switch window focus

bind=ALT,Tab,focusstack,next

bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down


# Swap window

bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right


# Window status

bind=ALT,g,toggleglobal,

bind=SUPER,Tab,toggleoverview,
bind=SUPER,backslash,togglefloating,
bind=SUPER,f,togglemaximizescreen,
bind=SUPER,a,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,

bind=ALT,i,minimized,
bind=ALT,o,toggleoverlay,
bind=ALT+SHIFT,I,restore_minimized

bind=SUPER,z,toggle_scratchpad


# Scroller layout

bind=SUPER,e,set_proportion,1.0
bind=SUPER,x,switch_proportion_preset,

bind=SUPER+ALT+CTRL,Left,scroller_stack,left
bind=SUPER+ALT+CTRL,Right,scroller_stack,right
bind=SUPER+ALT+CTRL,Up,scroller_stack,up
bind=SUPER+ALT+CTRL,Down,scroller_stack,down


# Dwindle layout
# manual split mode

bind=SUPER+SHIFT,Return,dwindle_toggle_split_direction


# Switch layout

bind=ALT,n,switch_layout


# Tag switching

# Previous / next tag
bind=SUPER,comma,viewtoleft,0
bind=SUPER,period,viewtoright,0

# Previous / next occupied tag
bind=SUPER+CTRL,comma,viewtoleft_have_client,0
bind=SUPER+CTRL,period,viewtoright_have_client,0

# View tags

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Move client to tag and focus it
#
# tagsilent:
# move client to the tag without focusing it
#
# Example:
# bind=SUPER,1,tagsilent,1

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Monitor switching

bind=ALT+SHIFT,Left,focusmon,left
bind=ALT+SHIFT,Right,focusmon,right
bind=ALT+SHIFT,Up,focusmon,up

bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right
bind=SUPER+ALT,Up,tagmon,up


# Gaps

bind=SUPER+SHIFT,X,incgaps,1
bind=SUPER+SHIFT,Z,incgaps,-1
bind=SUPER+SHIFT,R,togglegaps


# Move floating window

bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0


# Resize floating window

bind=CTRL+SUPER,Up,resizewin,+0,-50
bind=CTRL+SUPER,Down,resizewin,+0,+50
bind=CTRL+SUPER,Left,resizewin,-50,+0
bind=CTRL+SUPER,Right,resizewin,+50,+0


# Mouse Button Bindings
#
# Keep SUPER here because it is now the primary
# window-management modifier.
#
# btn_left and btn_right can't bind NONE modifier

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings

axisbind=ALT,UP,viewtoleft_have_client
axisbind=ALT,DOWN,viewtoright_have_client


# Monitor output

# Layer rules

layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi


# Startup
exec-once=kanshi
exec-once=start-pipewire
exec-once=start-waybar-sound
exec-once=flameshot
exec-once=swaync
exec=swaybg -i /home/jagerroni/floral-tiled.png -m fill

# Group bar decoration

group_bar_decorate_bg_color=0x4d5066ff
group_bar_decorate_border_color=0x6d7290ff
group_bar_decorate_fg_color=0xf8f8f2ff
group_bar_decorate_focus_bg_color=0xbd93f9ff
group_bar_decorate_focus_fg_color=0x282a36ff


# Jump label decoration

jump_label_decorate_bg_color=0x4d5066ff
jump_label_decorate_border_color=0x6d7290ff
jump_label_decorate_fg_color=0xf8f8f2ff
jump_label_decorate_focus_bg_color=0xbd93f9ff
jump_label_decorate_focus_fg_color=0x282a36ff


# Rendering

allow_tearing=1
hdr_depth=2


# Window rules
windowrule=isfloating:1,appid:^info\.exe$,title:^QUIK: окно сообщений$
