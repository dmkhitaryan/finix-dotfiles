log_level = "warn"
# language = "en-US"
# region   = "it-IT"
# outputs = "All"
position = "Top"
# layer = "Bottom"
# enable_esc_key = false

[modules]
left = [ "appLauncher", "Workspaces", [ "WindowTitle" ] ]
right = [ "SystemInfo", "MediaPlayer", "Notifications", [ "Tray", "Tempo", "Privacy", "Settings" ], "Capacity" ]

[updates]
check_cmd = "checkupdates; paru -Qua"
update_cmd = 'alacritty -e bash -c "paru; echo Done - Press enter to exit; read" &'
interval = 3600

[workspaces]
visibility_mode = "All"
group_by_monitor = false
enable_workspace_filling = false

[[CustomModule]]
name = "appLauncher"
icon = "󱗼"
command = "fuzzel"

[[CustomModule]]
name = "Capacity"
type = "Text"
listen_cmd = "/run/current-system/sw/bin/ashell-battery-capacity"

[window_title]
mode = "Title"
truncate_title_after_length = 50

[keyboard_layout]

[system_info]
indicators = [ "Cpu", "Memory", "Temperature" ]
interval = 5

[system_info.cpu]
warn_threshold = 60
alert_threshold = 80

[system_info.memory]
warn_threshold = 70
alert_threshold = 85

[system_info.temperature]

[system_info.disk]

[media_player]
max_title_length = 50

[tray]

[tempo]
format = "%a %d %b %R"
timezones = [ "Asia/Yerevan", "Europe/Amsterdam" ]
weather_indicator = "IconAndTemperature"

[notifications]
format = "%H:%M"
show_timestamps = true
show_bodies = true
toast = true
toast_position = "TopRight"
toast_timeout = 5000
toast_max_height = 200

[settings]
enable_tooltips = true
lock_cmd = "playerctl --all-players pause; nixGL hyprlock &"
shutdown_cmd = "sudo initctl poweroff"
suspend_cmd = "sudo initctl suspend"
reboot_cmd = "sudo initctl reboot"

audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
wifi_more_cmd = "nm-connection-editor"
vpn_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueberry"

peripheral_battery_format = "Icon"
audio_indicator_format = "Icon"
microphone_indicator_format = "Icon"
network_indicator_format = "Icon"
bluetooth_indicator_format = "Icon"
brightness_indicator_format = "Icon"

volume_step = 5
max_volume = 100

indicators = [
  "IdleInhibitor",
  "Audio",
  "Microphone",
  "Bluetooth",
  "Network",
  "Vpn",
  "Brightness",
]

[[settings.CustomButton]]
name = "Virtual Keyboard"
icon = "⌨️"
command = "/path/to/toggle-keyboard.sh"
status_command = "/path/to/check-keyboard-status.sh"
tooltip = "Toggle On-Screen Keyboard"

[osd]
enabled = false
timeout = 1500
show_volume_percentage = false
show_brightness_percentage = false

[animations]
enabled = false

[appearance]
scale_factor = 1.0
primary_color = "#7aa2f7"
success_color = "#9ece6a"
warning_color = "#e0af68"
danger_color = "#f7768e"
text_color = "#a9b1d6"
workspace_colors = [ "#7aa2f7", "#9ece6a" ]

[appearance.bar]
surface = "transparent"
opacity = 1.0

[appearance.menu]
opacity = 1.0

[appearance.background]
base = "#1a1b26"
weak = "#24273a"
strong = "#414868"
